version: 1
profiles:
  lean:
    description: Fast, bounded work and deterministic inspection.
    model: gpt-5.6-luna
    reasoningEffort: low
    approvalPolicy: on-request
    sandboxMode: workspace-write
    agents:
      maxThreads: 1
      defaultModel: gpt-5.6-luna
      defaultEffort: low

  build:
    description: Everyday implementation with economical subagents.
    model: gpt-5.6-terra
    reasoningEffort: medium
    approvalPolicy: on-request
    sandboxMode: workspace-write
    agents:
      maxThreads: 2
      defaultModel: gpt-5.6-luna
      defaultEffort: low

  review:
    description: Quality-first review for ambiguous or high-risk changes.
    model: gpt-5.6-sol
    reasoningEffort: high
    approvalPolicy: on-request
    sandboxMode: read-only
    agents:
      maxThreads: 2
      defaultModel: gpt-5.6-terra
      defaultEffort: medium
