  <g font-family="Segoe UI, Arial, sans-serif"><text x="76" y="88" fill="#8C80FF" font-size="14" font-weight="700" letter-spacing="2.5">01 · SEE THE SURFACE</text><text x="76" y="163" fill="#F8F7FF" font-size="52" font-weight="750" letter-spacing="-2">One command reveals the clutter.</text><text x="77" y="206" fill="#A5A2B4" font-size="19">Counts and findings stay on your machine. Prompt text stays private.</text></g>
