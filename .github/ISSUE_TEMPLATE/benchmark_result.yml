name: Share a CtxWise result
description: Contribute a reproducible context or usage result without sharing prompt contents.
title: "[benchmark]: "
labels:
  - benchmark
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing CtxWise. Do not paste authentication files, prompts, private repository content, or raw configuration values.
  - type: input
    id: version
    attributes:
      label: CtxWise and Codex versions
      description: Output of `ctxwise --version` and `codex --version`.
      placeholder: "CtxWise 0.1.0; codex-cli 0.147.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - WSL
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Redacted result
      description: Include counts, provenance labels, quality gate, and paired metrics only.
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: What was useful or confusing?
      description: Tell us whether the result changed a real Codex setup decision.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed secrets, prompt text, and private repository content.
          required: true
