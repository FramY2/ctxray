name: Bug report
description: Report a reproducible CtxRay problem without exposing private context.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CtxRay. Redact prompts, paths, config values, and credentials before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe command or fixture that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: ctxray-version
    attributes:
      label: CtxRay version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and Codex surface/version.
      placeholder: Windows 11, Node 24.x, Codex CLI x.y.z
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Optional. Do not include secrets, prompts, or private source code.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, authentication data, private prompts, and sensitive paths.
          required: true
